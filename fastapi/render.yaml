services:
  - type: web
    name: leadfinder-fastapi
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: LEADS_API_KEY
        sync: false
      - key: SERPAPI_API_KEY
        sync: false
      - key: MAX_RESULTS
        value: "100"
